[build-system]
requires = ["hatchling>=1.27,<1.29"]
build-backend = "hatchling.build"

[project]
name = "qdsv-bridge"
version = "0.7.0"
description = "Public domain-to-quantum SDK for portable QDSV Bridge artifacts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "QDSV / Qruba" }
]
keywords = ["qdsv", "semantic-computation", "quantum", "circuit", "qasm", "sdk", "conformance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
qiskit = [
  "qiskit>=2.3,<3",
  "qiskit-aer>=0.17,<0.18",
  "qiskit-qasm3-import>=0.5,<0.7",
]
docs = [
  "myst-parser>=2.0",
  "qiskit-sphinx-theme>=2.0",
  "sphinx>=7.0",
]

[project.urls]
Homepage = "https://qdsv.cloud"
Documentation = "https://qdsvquantum-afk.github.io/qdsv-bridge/"
Source = "https://github.com/qdsvquantum-afk/qdsv-bridge"
Changelog = "https://github.com/qdsvquantum-afk/qdsv-bridge/blob/main/CHANGELOG.md"
Issues = "https://github.com/qdsvquantum-afk/qdsv-bridge/issues"
Security = "https://github.com/qdsvquantum-afk/qdsv-bridge/blob/main/SECURITY.md"

[project.scripts]
qdsv-bridge = "qdsv_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qdsv_bridge"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "live_bridge: requires an explicitly configured QDSV Bridge HTTP endpoint",
]
