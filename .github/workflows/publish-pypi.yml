name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install release and test tools
        run: python -m pip install --upgrade build pytest twine ".[qiskit]"

      - name: Run SDK tests
        run: python -m pytest

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          package_version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if tag_version != package_version:
              raise SystemExit(
                  f"Tag version {tag_version!r} does not match package version "
                  f"{package_version!r}."
              )
          PY

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Enforce public distribution boundary
        run: python tools/verify_public_distribution.py --dist-dir dist --report distribution-conformance.json

      - name: Build public conformance verifier
        run: python tools/build_conformance_release.py --output release-assets

      - name: Publish release checksums
        run: >-
          python tools/write_release_checksums.py
          --output release-assets/RELEASE-SHA256SUMS
          dist/*
          release-assets/qdsv-bridge-conformance-v0.7.0.tar.gz

      - name: Verify public conformance verifier
        run: |
          (cd release-assets && sha256sum -c SHA256SUMS)
          tar -xzf release-assets/qdsv-bridge-conformance-v0.7.0.tar.gz
          python qdsv-bridge-conformance-v0.7.0/suite/verify_manifest.py

      - name: Attest Python distributions
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Attest public conformance verifier
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          subject-path: release-assets/qdsv-bridge-conformance-v0.7.0.tar.gz

      - name: Upload distributions for publication
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

      - name: Upload public conformance and release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-and-conformance
          path: |
            distribution-conformance.json
            release-assets/
          if-no-files-found: error

  publish:
    name: Publish trusted distributions
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qdsv-bridge/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Publish signed GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: release-files

      - name: Download conformance and evidence
        uses: actions/download-artifact@v8
        with:
          name: release-evidence-and-conformance
          path: release-evidence

      - name: Create immutable public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "QDSV Bridge $GITHUB_REF_NAME"
          --generate-notes
          release-files/*
          release-evidence/distribution-conformance.json
          release-evidence/release-assets/*
